<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUNGER Guide - Квесты</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <div class="container">
                <div class="header-content">
                    <a href="index.html" class="logo" style="text-decoration: none;">HUNGER<span>Guide</span></a>
                    <div class="header-controls">
                        <a href="items.html" class="btn-items-nav">📦 Предметы</a>
                        <button class="theme-toggle" id="themeToggle" title="Переключить тему">🌙</button>
                        <div class="stats">
                            <span>Выполнено: <strong id="completedCount">0</strong></span>
                            <span>Всего: <strong id="totalCount">0</strong></span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="container">
            <!-- Фильтры -->
            <div class="filters">
                <div class="filter-group">
                    <label>Статус:</label>
                    <select id="statusFilter">
                        <option value="all">Все</option>
                        <option value="active">Активные</option>
                        <option value="completed">Выполненные</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Поиск:</label>
                    <input type="text" id="searchFilter" placeholder="Название квеста...">
                </div>
                <div class="filter-group">
                    <label>Сортировка:</label>
                    <select id="sortFilter">
                        <option value="default">По порядку</option>
                        <option value="name">По названию</option>
                        <option value="npc">По НПС</option>
                        <option value="status">По статусу</option>
                    </select>
                </div>
            </div>

            <!-- Сетка НПС -->
            <div class="npcs-grid" id="npcGrid"></div>

            <!-- Список квестов -->
            <section class="quests-section">
                <div class="quests-header">
                    <h2 class="quests-title" id="questTitle">
                        <span>📋 Квесты</span>
                        <small id="npcSubtitle">выберите НПС</small>
                    </h2>
                    <button class="btn-clear-completed" id="clearCompleted">Очистить выполненные</button>
                </div>
                <div class="quest-list" id="questList">
                    <div class="empty-message">Выберите персонажа, чтобы увидеть список его заданий</div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
